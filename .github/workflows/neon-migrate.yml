name: "Neon · migraciones de la base real"

# Aplica las migraciones SQL idempotentes de db/migrations/ contra la rama
# br-sweet-shape-b42xhogj del proyecto Neon square-surf-41242074 (base neondb).
#
# Requiere 1 secreto:  NEON_API_KEY  (https://console.neon.tech/app/settings/api-keys)
#   Settings → Secrets and variables → Actions → New repository secret
#
# Se ejecuta: manualmente (Run workflow) o al cambiar db/migrations/*.sql
# Nota: la clave se inyecta como variable de entorno NK (desde el almacén de
# secretos de Actions) y se pasa al CLI con --api-key; nunca va en el archivo.

on:
  workflow_dispatch:
  push:
    paths:
      - "db/migrations/*.sql"
      - ".github/workflows/neon-migrate.yml"

concurrency:
  group: neon-migrate
  cancel-in-progress: false

# Para publicar estado-db.json en la rama estado-db (verificación del
# estado real de la base sin exponer credenciales)
permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      NK: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar acceso a Neon
        run: |
          if [ -z "$NK" ]; then
            echo "::error::Falta el secreto NEON_API_KEY. Créalo en https://console.neon.tech/app/settings/api-keys y añádelo en Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Install Neon CLI
        run: npm install -g neon@latest

      - name: Resolver cadena de conexión (Neon CLI)
        run: |
          neon --version
          CS=$(neon connection-string br-sweet-shape-b42xhogj \
            --project-id square-surf-41242074 \
            --database neondb --api-key "$NK" 2>/tmp/cs_err || true)
          if [ -z "$CS" ]; then
            CS=$(neon cs br-sweet-shape-b42xhogj \
              --project-id square-surf-41242074 \
              --database neondb --api-key "$NK" 2>/dev/null || true)
          fi
          if [ -z "$CS" ]; then
            echo "::error::Neon CLI no devolvió cadena de conexión. Diagnóstico:"
            cat /tmp/cs_err 2>/dev/null || true
            neon projects list --api-key "$NK" || true
            neon branches list --project-id square-surf-41242074 --api-key "$NK" || true
            exit 1
          fi
          echo "::add-mask::$CS"
          echo "NEON_CS=$CS" >> "$GITHUB_ENV"
          echo "✅ Cadena de conexión resuelta (oculta en el log)"

      - name: Aplicar migraciones (idempotentes)
        run: |
          psql --version
          set -e
          for f in db/migrations/*.sql; do
            echo "════════ ▶ $f ════════"
            psql "$NEON_CS" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "✅ Migraciones aplicadas"

      - name: Resumen de la base (tablas y filas)
        if: always() && env.NEON_CS != ''
        run: |
          psql "$NEON_CS" -c "SELECT relname AS tabla, n_live_tup AS filas_aprox FROM pg_stat_user_tables WHERE schemaname = 'public' ORDER BY relname;" || true

      - name: Estado de la base → rama estado-db (verificación legible)
        if: always() && env.NEON_CS != ''
        run: |
          set +e
          cat > /tmp/estado.sql <<'EOSQL'
          DO $$
          DECLARE v jsonb;
          BEGIN
            v := jsonb_build_object('generado', to_char(now() AT TIME ZONE 'utc', 'YYYY-MM-DD"T"HH24:MI:SS"Z"'));
            v := jsonb_set(v, '{tablas}', (SELECT coalesce(jsonb_object_agg(relname, n_live_tup), '{}'::jsonb) FROM pg_stat_user_tables WHERE schemaname = 'public'));
            BEGIN
              v := jsonb_set(v, '{faceit_matches_recientes}', (SELECT coalesce(jsonb_agg(j), '[]'::jsonb) FROM (SELECT jsonb_build_object('match_id', faceit_match_id, 'resultado', result, 'xp', xp_awarded, 'jugado', played_at) j FROM faceit_matches ORDER BY played_at DESC LIMIT 10) s));
            EXCEPTION WHEN undefined_table THEN v := jsonb_set(v, '{faceit_matches_recientes}', 'null'::jsonb);
            END;
            BEGIN
              v := jsonb_set(v, '{faceit_webhook_events}', jsonb_build_object(
                'filas', (SELECT count(*) FROM faceit_webhook_events),
                'ultimos', (SELECT coalesce(jsonb_agg(j), '[]'::jsonb) FROM (SELECT jsonb_build_object('tipo', event_type, 'fecha', created_at, 'muestra', left(payload::text, 500)) j FROM faceit_webhook_events ORDER BY created_at DESC LIMIT 6) s)));
            EXCEPTION WHEN undefined_table OR undefined_column THEN v := jsonb_set(v, '{faceit_webhook_events}', 'null'::jsonb);
            END;
            BEGIN
              v := jsonb_set(v, '{players_con_xp}', (SELECT count(*) FROM players WHERE xp > 0));
            EXCEPTION WHEN undefined_column THEN v := jsonb_set(v, '{players_con_xp}', 'null'::jsonb);
            END;
            CREATE TEMP TABLE estado_salida (j jsonb);
            INSERT INTO estado_salida VALUES (v);
          END $$;
          SELECT j FROM estado_salida;
          EOSQL
          psql "$NEON_CS" -At -f /tmp/estado.sql > estado-db.json 2>/tmp/estado_err.txt
          if [ ! -s estado-db.json ]; then
            echo '{"error": "no se pudo leer la base"}' > estado-db.json
            echo "::warning::estado-db: $(cat /tmp/estado_err.txt)"
          fi
          git config user.name "vants-estado-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B estado-db
          git add -f estado-db.json
          git commit -m "Estado de la base (automatico)" || echo "sin cambios en el estado"
          git push -f origin estado-db || echo "::warning::no se pudo publicar la rama estado-db"
