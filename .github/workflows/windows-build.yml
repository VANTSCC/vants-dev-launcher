name: Build Windows · VANTS Setup

# Compila el instalador del launcher VANTS (desktop-electron) en un runner
# Windows real — dos tecnologias de instalador en cada build:
#   · MSI  (WiX Toolset)  — instalador profesional para distribucion/empresas
#   · NSIS                — el que usa electron-updater para el auto-update
# Disparo: manual (workflow_dispatch) o push de un tag hub-v* (ej. hub-v2.4.2).
# Artefacto en cada ejecucion; en tags, borrador de release con MSI + EXE +
# latest.yml (canal de auto-update).

on:
  workflow_dispatch:
  push:
    tags:
      - "hub-v*"

permissions:
  contents: write

jobs:
  build:
    name: MSI (WiX) + NSIS x64 (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias (npm ci)
        run: npm ci

      - name: Compilar instalador NSIS x64
        # --publish=never: el release lo crea el paso 'gh release create' de abajo con
        # github.token. Sin esto, electron-builder activa implicit publishing al ver el
        # tag y aborta exigiendo GH_TOKEN (así el build no depende de tokens en build).
        run: npm run dist:win -- --publish=never

      - name: Subir artefacto (todas las ejecuciones)
        uses: actions/upload-artifact@v4
        with:
          name: VANTS-Setup-x64
          path: |
            desktop-electron/dist/VANTS-Setup-*.exe
            desktop-electron/dist/VANTS-Setup-*.msi
            desktop-electron/dist/latest.yml
          if-no-files-found: error

      - name: Borrador de release con el instalador (solo tags hub-v*)
        if: startsWith(github.ref, 'refs/tags/hub-v')
        working-directory: ${{ github.workspace }}   # ruta desde la RAIZ del repo (el default del job es desktop-electron/)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # MSI + EXE + latest.yml (+ blockmaps si existen) — lo que haya en dist/
          FILES=()
          for f in desktop-electron/dist/VANTS-Setup-*.exe \
                   desktop-electron/dist/VANTS-Setup-*.msi \
                   desktop-electron/dist/VANTS-Setup-*.exe.blockmap \
                   desktop-electron/dist/latest.yml; do
            [ -e "$f" ] && FILES+=("$f")
          done
          [ ${#FILES[@]} -eq 0 ] && { echo "ERROR: no hay instaladores en dist/"; exit 1; }
          echo "Assets: ${FILES[*]}"
          VERSION="${GITHUB_REF_NAME#hub-v}"
          NOTAS="Instalador oficial de VANTS (captura de trafico HAR + integracion ExitLag + deteccion de juego por proceso). MSI profesional (WiX) para distribucion/empresas; EXE (NSIS) con auto-update via electron-updater."
          # Idempotente: si el release ya existe (creado a mano o en re-run), sube/actualiza los assets
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --draft --repo "$GITHUB_REPOSITORY" \
              --title "VANTS $VERSION" --notes "$NOTAS"
          fi
