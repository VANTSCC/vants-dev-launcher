name: Build Windows · VANTS HUB Setup

# Compila el instalador NSIS x64 del VANTS HUB (desktop-electron) en un runner
# Windows real — sin wine, sin atajos. Dos formas de dispararlo:
#   1. Manual: pestaña Actions → "Build Windows · VANTS HUB Setup" → Run workflow.
#   2. Automático: push de un tag hub-v* (ej.: hub-v2.4.1, hub-v2.5.0).
# En cada ejecución queda un ARTEFACTO descargable; en tags, además un BORRADOR
# de release con el .exe adjunto (lo revisas y lo publicas cuando quieras).

on:
  workflow_dispatch:
  push:
    tags:
      - "hub-v*"

permissions:
  contents: write

jobs:
  build:
    name: NSIS x64 (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias (npm ci)
        run: npm ci

      - name: Compilar instalador NSIS x64
        # --publish=never: el release lo crea el paso 'gh release create' de abajo con
        # github.token. Sin esto, electron-builder activa implicit publishing al ver el
        # tag y aborta exigiendo GH_TOKEN (así el build no depende de tokens en build).
        run: npm run dist:win -- --publish=never

      - name: Subir artefacto (todas las ejecuciones)
        uses: actions/upload-artifact@v4
        with:
          name: VANTS-Hub-Setup-x64
          path: desktop-electron/dist/VANTS-Hub-Setup-*.exe
          if-no-files-found: error

      - name: Borrador de release con el instalador (solo tags hub-v*)
        if: startsWith(github.ref, 'refs/tags/hub-v')
        working-directory: ${{ github.workspace }}   # ruta desde la RAIZ del repo (el default del job es desktop-electron/)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=$(ls desktop-electron/dist/VANTS-Hub-Setup-*.exe | head -1)
          echo "Instalador: $EXE"
          VERSION="${GITHUB_REF_NAME#hub-v}"
          NOTAS="Instalador oficial del VANTS HUB (captura de trafico HAR + integracion ExitLag + deteccion de juego fiable). Descarga, ejecuta el Setup y el launcher se auto-actualiza solo (electron-updater)."
          # Idempotente: si el release ya existe (creado a mano o en re-run), sube/actualiza el asset
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$EXE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$EXE" --draft --repo "$GITHUB_REPOSITORY" \
              --title "VANTS HUB $VERSION" --notes "$NOTAS"
          fi
