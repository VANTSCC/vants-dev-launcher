name: Desktop - compilar instaladores (Tauri)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v5

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Instalar dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Instalar CLI de Tauri
        run: npm install

      - name: Generar iconos desde la marca VANTS
        run: npx tauri icon ../assets/brand/vants-mark-1024.png -o src-tauri/icons

      # Cada ejecucion usa su propia etiqueta (version + numero de build). Asi nunca intenta
      # sobrescribir assets de una release ya publicada (las releases inmutables lo prohiben).
      - name: Compilar instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__-build${{ github.run_number }}
          releaseName: 'VANTS Desktop v__VERSION__ (build ${{ github.run_number }})'
          releaseBody: 'Instaladores de VANTS para Windows, macOS y Linux. Se actualiza sola con la web.'
          releaseDraft: true
          prerelease: false
