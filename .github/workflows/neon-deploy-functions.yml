name: "Neon · deploy de funciones (linker + vantsdata)"

# Despliega las Neon Functions públicas con sus variables de entorno:
#   · linker    — conectores OAuth de cuentas (FACEIT, Twitch, Kick...)
#   · vantsdata — proxy público de lectura (lecturas anónimas de la web)
# Requiere los secretos del repo:
#   NEON_API_KEY      — API key de Neon (ya existente, la usa neon-migrate)
#   FACEIT_CLIENT_ID  — client ID OAuth PKCE de FACEIT (faceit.com/developers)
#   FACEIT_API_KEY    — API key server-side de FACEIT (Data API v4)
# Se ejecuta al cambiar neon-functions/** o manualmente (Run workflow).

on:
  workflow_dispatch:
  push:
    paths:
      - "neon-functions/**"
      - ".github/workflows/neon-deploy-functions.yml"

concurrency:
  group: neon-deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NK: ${{ secrets.NEON_API_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      FACEIT_CLIENT_ID: ${{ secrets.FACEIT_CLIENT_ID }}
      FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
      LINKER_URL: https://br-sweet-shape-b42xhogj-linker.compute.c-6.us-east-2.aws.neon.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Neon CLI
        run: npm install -g neon@latest

      # esbuild (bundling de la función) necesita resolver 'pg' localmente:
      # el package.json de la raíz lo declara para esto.
      - name: Instalar dependencias de bundling (pg)
        run: npm install --no-audit --no-fund

      - name: Desplegar linker
        run: |
          neon functions deploy linker \
            --project-id square-surf-41242074 \
            --branch br-sweet-shape-b42xhogj \
            --src neon-functions/linker \
            --api-key "$NK" \
            --wait \
            --env AUTH0_DOMAIN=vants.eu.auth0.com \
            --env AUTH0_AUDIENCE=https://api.vants.app \
            --env VANTS_SITE_URL=https://feispla.github.io/Vants \
            --env LINKER_URL=$LINKER_URL \
            ${FACEIT_CLIENT_ID:+--env FACEIT_CLIENT_ID=$FACEIT_CLIENT_ID} \
            ${FACEIT_API_KEY:+--env FACEIT_API_KEY=$FACEIT_API_KEY}

      - name: Desplegar vantsdata (proxy público de lectura)
        run: |
          neon functions deploy vantsdata \
            --project-id square-surf-41242074 \
            --branch br-sweet-shape-b42xhogj \
            --src neon-functions/vantsdata \
            --api-key "$NK" \
            --wait

      - name: Verificación (diagnóstico público del linker)
        run: |
          sleep 5
          curl -s --max-time 20 "$LINKER_URL/" | head -c 900
          echo

      - name: "Verificación vantsdata (diagnóstico + lectura real)"
        env:
          VANTSDATA_URL: https://br-sweet-shape-b42xhogj-vantsdata.compute.c-6.us-east-2.aws.neon.tech
        run: |
          sleep 5
          echo "--- GET / (debe responder {\"ok\":true,...}) ---"
          curl -s --max-time 20 "$VANTSDATA_URL/" | head -c 300; echo
          echo "--- GET /?table=players&limit=1 (lectura real) ---"
          RESP=$(curl -s --max-time 30 -w "\nHTTP:%{http_code}" "$VANTSDATA_URL/?table=players&limit=1&select=username,verified")
          echo "$RESP" | head -c 400; echo
          CODE=$(echo "$RESP" | tail -1 | sed 's/HTTP://')
          if [ "$CODE" != "200" ]; then
            echo "::warning::vantsdata devolvió HTTP $CODE en la verificación (puede necesitar un reintento si el compute acaba de arrancar)"
          fi
