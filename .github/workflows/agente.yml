name: "AGENTE VANTS · vigilancia y control"

# ─────────────────────────────────────────────────────────────────────────────
# El Agente VANTS (services/agent-service) vigila TODO cada 30 minutos:
#   web (Worker) · webhook FACEIT · launcher (release + latest.yml) · workflows
#   · base Neon (colas, eventos pendientes, incidentes)
# Decide con su cerebro (reglas + NLU en español; LLM opcional vía
# AGENT_LLM_*), guarda la memoria en Neon (agent_runs/agent_events, migración
# 25) y ejecuta acciones seguras con guarda anti-bucle:
#   · web caída o deploy fallido  → re-lanza cloudflare-deploy (1 vez por commit)
#   · migraciones fallidas        → re-lanza neon-migrate (1 vez por commit)
#   · otros workflows fallidos    → re-run (1 vez por run)
# El bot de Discord (commands/agente.py + agent_bridge.py) lee esa memoria y
# avisa por DM al dueño; también puede procesar /agente comando (ruta Neon).
# Si Discord no está disponible, la evidencia queda en Neon y en este resumen.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución (ciclo | informe | comando)"
        required: false
        default: "ciclo"
        type: choice
        options: [ciclo, informe, comando]
      comando:
        description: "Orden en lenguaje natural (solo si modo=comando)"
        required: false
        default: ""

# Fase 6 · despliegues controlados: un agente a la vez
concurrency:
  group: agente
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # re-dispatch de deploys y re-runs (guardas anti-bucle en Neon)

jobs:
  vigilancia:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NK: ${{ secrets.NEON_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      VANTS_DISCORD_WEBHOOK: ${{ secrets.VANTS_DISCORD_WEBHOOK }}
      # Cerebro agéntico GLM: basta AGENT_LLM_KEY (URL por defecto global
      # api.z.ai; solo se define si la key es de bigmodel.cn).
      AGENT_LLM_URL: ${{ secrets.AGENT_LLM_URL || 'https://api.z.ai/api/paas/v4' }}
      AGENT_LLM_KEY: ${{ secrets.AGENT_LLM_KEY }}
      AGENT_LLM_MODEL: ${{ secrets.AGENT_LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del agente
        run: npm ci --no-audit --no-fund
        working-directory: services/agent-service

      - name: Resolver cadena de conexión Neon (memoria del agente)
        run: |
          if [ -z "$NK" ]; then
            echo "::error::Falta el secreto NEON_API_KEY (Settings → Secrets → Actions)."
            exit 1
          fi
          npm install -g neon@latest >/dev/null 2>&1
          CS=$(neon connection-string br-sweet-shape-b42xhogj \
            --project-id square-surf-41242074 \
            --database neondb --api-key "$NK" 2>/tmp/cs_err || true)
          if [ -z "$CS" ]; then
            CS=$(neon cs br-sweet-shape-b42xhogj \
              --project-id square-surf-41242074 \
              --database neondb --api-key "$NK" 2>/dev/null || true)
          fi
          if [ -z "$CS" ]; then
            echo "::error::Neon CLI no devolvió cadena de conexión."
            cat /tmp/cs_err 2>/dev/null || true
            exit 1
          fi
          echo "::add-mask::$CS"
          echo "DATABASE_URL=$CS" >> "$GITHUB_ENV"
          echo "✅ Memoria del agente (Neon) conectada"

      - name: Ejecutar el agente (ciclo / informe / comando)
        id: agente
        working-directory: services/agent-service
        run: |
          MODO="${{ github.event.inputs.modo || 'ciclo' }}"
          COMANDO="${{ github.event.inputs.comando }}"
          if [ "$MODO" = "comando" ] && [ -n "$COMANDO" ]; then
            node cli.js comando "$COMANDO" | tee /tmp/agente_salida.txt
          elif [ "$MODO" = "informe" ]; then
            node cli.js informe | tee /tmp/agente_salida.txt
          else
            node cli.js ciclo | tee /tmp/agente_salida.txt
          fi

      - name: Resumen del ciclo → GitHub Summary + Discord
        if: always()
        working-directory: services/agent-service
        run: |
          node - <<'NODE' > /tmp/resumen.md || true
          const fs = require('fs');
          let r = null;
          try { r = JSON.parse(fs.readFileSync('/tmp/agente_salida.txt', 'utf8')); } catch {}
          if (!r || !r.estado) {
            console.log('## Agente VANTS\n\n(sin salida JSON — revisa el paso anterior)');
            process.exit(0);
          }
          const icono = { UP: '🟢', DEGRADED: '🟡', DOWN: '🔴' }[r.estado] || '⚪';
          const lineas = [`## ${icono} Agente VANTS — ${r.estado}`, '', `**Resumen:** ${r.resumen || '—'}`, ''];
          // IA visible sin filtrar la key: solo se muestra si está definida
          lineas.push(`**IA (GLM):** ${process.env.AGENT_LLM_KEY ? 'activa · ' + (process.env.AGENT_LLM_MODEL || 'glm-5.3-flash') : 'modo reglas (falta AGENT_LLM_KEY)'}`, '');
          if (Array.isArray(r.hallazgos) && r.hallazgos.length) {
            lineas.push('| Chequeo | Estado | Detalle |', '|---|---|---|');
            for (const h of r.hallazgos) {
              if (!h || h.estado === 'omitido') continue;
              const ic = { ok: '✅', aviso: '⚠️', fallo: '❌' }[h.estado] || '·';
              lineas.push(`| ${h.label || h.id} | ${ic} ${h.estado} | ${String(h.detalle || '').slice(0, 120)} |`);
            }
            lineas.push('');
          }
          if (Array.isArray(r.acciones) && r.acciones.length) {
            lineas.push('**Acciones:**');
            for (const a of r.acciones) lineas.push(`- ${a.ejecutada ? '⚡' : '⏸'} \`${a.id}\` — ${a.resultado || ''}`);
            lineas.push('');
          }
          const md = lineas.join('\n');
          console.log(md);
          // embed opcional para Discord (solo si el secret existe)
          const color = { UP: 0x3ddc84, DEGRADED: 0xffb547, DOWN: 0xff4655 }[r.estado] || 0x5865f2;
          fs.writeFileSync('/tmp/embed.json', JSON.stringify({
            username: 'Agente VANTS',
            embeds: [{ title: 'Agente VANTS · ciclo de vigilancia', description: md.slice(0, 3800), color }],
            allowed_mentions: { parse: [] },
          }));
          NODE
          cat /tmp/resumen.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ -n "$VANTS_DISCORD_WEBHOOK" ]; then
            curl -sS -o /dev/null -X POST -H 'content-type: application/json' -d @/tmp/embed.json "$VANTS_DISCORD_WEBHOOK" || true
          fi

      # El bot de Discord ya NO necesita hosting de pago (Railway/Render):
      # la Neon Function "vantsbot" entrega los DMs del puente (incidentes y
      # respuestas) y atiende /agente. Este paso la dispara tras cada ciclo.
      - name: Entregar avisos por Discord (vantsbot · Neon Functions)
        if: always()
        env:
          VANTS_BOT_URL: https://br-sweet-shape-b42xhogj-vantsbot.compute.c-6.us-east-2.aws.neon.tech
          VANTS_BOT_SECRET: ${{ secrets.VANTS_BOT_SECRET }}
        run: |
          if [ -z "$VANTS_BOT_SECRET" ]; then
            echo "::warning::Sin el secret VANTS_BOT_SECRET no se disparan los DMs del puente."
            exit 0
          fi
          echo "--- ciclo del puente (incidentes + respuestas → DM al dueño) ---"
          curl -sS --max-time 60 -X POST -H "x-vants-bot: $VANTS_BOT_SECRET" "$VANTS_BOT_URL/tarea" || true
          echo
