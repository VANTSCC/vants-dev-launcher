<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANTS — Desktop</title>
  <style>
    :root { --bg: #0b131b; --card: #111a24; --text: #e8eef5; --muted: #8b97a3; --accent: #ff4655; --green: #3ddc84; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .app { max-width: 480px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; }
    .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
    .logo img { width: 40px; height: 40px; }
    .logo h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .logo h1 span { color: var(--accent); }
    .card { background: var(--card); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; }
    .card p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: 0.875rem 1.5rem; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #e03d4a; transform: translateY(-1px); }
    .btn-secondary { background: #222; color: var(--text); border: 1px solid #333; }
    .btn-secondary:hover { background: #2a2a2a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
    .status.success { color: var(--green); }
    .status.error { color: var(--accent); }
    .hidden { display: none; }
    .user-info { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .user-avatar { width: 48px; height: 48px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.25rem; }
    .user-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .user-details h3 { font-size: 1.1rem; }
    .user-details p { color: var(--muted); font-size: 0.85rem; margin: 0; }
    .token-box { background: #0a0f14; border-radius: 8px; padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; word-break: break-all; color: var(--muted); margin-top: 1rem; }
    .nav { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
    .nav button { flex: 1; padding: 0.5rem; background: transparent; border: 1px solid #333; border-radius: 6px; color: var(--muted); font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
    .nav button:hover, .nav button.active { border-color: var(--accent); color: var(--text); }
    .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
    .splash img { width: 120px; height: 120px; margin-bottom: 1.5rem; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .splash h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .splash p { color: var(--muted); margin-bottom: 2rem; }
  </style>
</head>
<body>
  <!-- Splash / Login -->
  <div id="login-view" class="app">
    <div class="splash">
      <img src="./assets/vants-mark.svg" alt="VANTS">
      <h1>VANT<span style="color:var(--accent)">CALL</span></h1>
      <p>Plataforma competitiva de esports</p>
      <button class="btn btn-primary" id="login-btn" style="max-width:280px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Iniciar sesión con Auth0
      </button>
      <div class="status" id="login-status"></div>
    </div>
  </div>

  <!-- App principal (después de login) -->
  <div id="app-view" class="app hidden">
    <div class="logo">
      <img src="./assets/vants-mark.svg" alt="">
      <h1>VANT<span style="color:var(--accent)">CALL</span></h1>
    </div>

    <div class="card">
      <div class="user-info" id="user-info">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-details">
          <h3 id="user-name">Cargando…</h3>
          <p id="user-email">—</p>
        </div>
      </div>
      <div class="nav">
        <button data-view="dashboard" class="active">Inicio</button>
        <button data-view="ranked">Ranked</button>
        <button data-view="socials">Redes</button>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="card">
      <h2>Mi cuenta</h2>
      <div id="dashboard-content">
        <p>Cargando datos…</p>
      </div>
    </div>

    <!-- Ranked -->
    <div id="ranked-view" class="card hidden">
      <h2>Ranked</h2>
      <div id="ranked-content">
        <p>Tu rango y estadísticas aparecerán aquí.</p>
      </div>
    </div>

    <!-- Socials -->
    <div id="socials-view" class="card hidden">
      <h2>Redes sociales</h2>
      <div id="socials-content">
        <p>Vincula tus redes desde la web.</p>
      </div>
    </div>

    <div class="card">
      <h2>Sesión</h2>
      <div class="token-box" id="token-box">No hay token activo</div>
      <button class="btn btn-secondary" id="logout-btn" style="margin-top:1rem">
        Cerrar sesión
      </button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
