name: Desktop — compilar instaladores (Tauri)

on:
  push:
    branches: [main]
    paths: ['desktop/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    permissions:
      contents: write

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias de Linux (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          # En tags v* crea/actualiza un GitHub Release y adjunta los instaladores;
          # en pushes a main solo compila y deja el artefacto en el run.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('VANTS Desktop {0}', github.ref_name) || '' }}
          releaseBody: 'Instaladores oficiales del launcher VANTS. Windows: VANTS_2.1.0_x64-setup.exe (NSIS, instalador por usuario). Verifica el SHA-256 publicado en los artefactos antes de ejecutar.'
          releaseDraft: false
          prerelease: false
          includeRelease: ${{ startsWith(github.ref, 'refs/tags/') }}
          includeUpdater: false

      - name: Subir artefacto (Windows, sin release)
        if: "!startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'"
        uses: actions/upload-artifact@v4
        with:
          name: vants-desktop-windows
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
